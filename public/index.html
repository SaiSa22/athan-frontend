<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Smart Adhan Clock</title>
  <meta name="description" content="Configure your Smart Adhan Clock device." />
  
  <meta name="theme-color" content="#f5f5dc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Adhan Clock" />
  
  <link rel="manifest" href="/manifest.json" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    body {
      margin: 0;
      background-color: #f5f5dc;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    
    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5f5dc;
      z-index: 9999;
    }
    
    .loader-content {
      text-align: center;
      color: #5c4d3c;
    }
    
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0dcc8;
      border-top-color: #5c4d3c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loader-text {
      font-size: 14px;
      color: #8b7355;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <p class="loader-text">Loading...</p>
      </div>
    </div>
  </div>
</body>
</html>
